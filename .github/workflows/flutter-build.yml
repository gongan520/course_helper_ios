name: Build iOS IPA

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS (unsigned IPA)
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Toolchain versions
        run: |
          flutter --version
          xcodebuild -version

      - name: Install dependencies
        run: flutter pub get

      - name: Extract version
        id: version
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "APP_VERSION=${VERSION:-1.2.3}" >> "$GITHUB_OUTPUT"
          echo "Using app version: ${VERSION:-1.2.3}"

      - name: Align deployment target
        working-directory: ios
        run: |
          sed -i '' -E "s/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]+;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g" \
            Runner.xcodeproj/project.pbxproj

      - name: Build iOS release (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.APP_VERSION }}"
          APP="build/ios/iphoneos/Runner.app"
          rm -rf Payload && mkdir Payload
          cp -R "$APP" Payload/
          zip -qry "CourseHelper_${VERSION}_unsigned.ipa" Payload
          ls -lh "CourseHelper_${VERSION}_unsigned.ipa"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :MinimumOSVersion" "$APP/Info.plist" || true

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa-${{ steps.version.outputs.APP_VERSION }}
          path: CourseHelper_*_unsigned.ipa
          if-no-files-found: error
          retention-days: 30

  release:
    name: Create GitHub Release
    needs: build-ios
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Get version from tag
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "VERSION=$TAG" >> "$GITHUB_OUTPUT"

      - name: Get tag message
        id: tag_message
        run: |
          git fetch --tags --force
          TAG=${{ steps.get_version.outputs.VERSION }}
          TAG_MSG=$(git for-each-ref refs/tags/$TAG --format='%(contents)')
          echo "TAG_MSG<<EOF" >> "$GITHUB_ENV"
          echo "$TAG_MSG" >> "$GITHUB_ENV"
          echo "EOF" >> "$GITHUB_ENV"

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release-assets/*/*.ipa
          name: Release ${{ steps.get_version.outputs.VERSION }}
          tag_name: ${{ steps.get_version.outputs.VERSION }}
          body: ${{ env.TAG_MSG }}
          update_release: true
